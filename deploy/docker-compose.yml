# Production of www.ucicle.fr on one Linux server: deploy/README.md.
# Run from this directory, with deploy/.env (copy of .env.example):
#   docker compose pull && docker compose up -d
# The `build` sections let the images be built on the server too (docker compose build), from a
# checkout of the whole repository.

name: ucicle

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ucicle}
      POSTGRES_DB: ${POSTGRES_DB:-ucicle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      # Read by db/init/01-roles.sql (role ucicle_web).
      POSTGRES_WEB_PASSWORD: ${POSTGRES_WEB_PASSWORD:?set POSTGRES_WEB_PASSWORD in deploy/.env}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # No `ports`: reachable only from the containers of the `data` network.
    networks: [data]
    logging: *logging

  web:
    image: ${WEB_IMAGE:-ghcr.io/g3wis/ucicle-web}:${IMAGE_TAG:-latest}
    build:
      context: ../front
      dockerfile: ../deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "4321"
      DATABASE_URL: ${WEB_DATABASE_URL:?set WEB_DATABASE_URL in deploy/.env}
      DATABASE_POOL: ${DATABASE_POOL:-5}
      GAME_DATA_ORIGIN: ${GAME_DATA_ORIGIN:-https://s3.fr-par.scw.cloud/ucicle.com}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # The home answers 200 even when the database is down (it says so): this checks the server.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # Port 4321 is reached by nginx only (no `ports`).
    networks: [edge, data]
    logging: *logging

  jobs:
    image: ${JOBS_IMAGE:-ghcr.io/g3wis/ucicle-jobs}:${IMAGE_TAG:-latest}
    build:
      context: ../functions
      dockerfile: ../deploy/jobs.Dockerfile
      additional_contexts:
        scheduler: ../deploy/jobs
    restart: unless-stopped
    # tini as PID 1: `docker compose stop` ends the schedule loop at once.
    init: true
    environment:
      DATABASE_URL: ${JOBS_DATABASE_URL:?set JOBS_DATABASE_URL in deploy/.env}
      TZ: ${TZ:-Europe/Paris}
      NIGHTLY_AT: ${NIGHTLY_AT:-04:00}
      WEEKLY_DAY: ${WEEKLY_DAY:-7}
      COLLECT_RECENT_DAYS: ${COLLECT_RECENT_DAYS:-14}
      HTTP_USER_AGENT: ${HTTP_USER_AGENT:-}
      RAW_ARCHIVE_DIR: /data/raw
    volumes:
      # Raw DataRide archive (/data/raw) and the schedule's state (/data/scheduler).
      - jobs_data:/data
      - cache_signal:/var/run/ucicle-signal
    depends_on:
      db:
        condition: service_healthy
    networks: [data]
    logging: *logging

  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    init: true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ucicle.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/50-ucicle-cache-purge.sh:/docker-entrypoint.d/50-ucicle-cache-purge.sh:ro
      - ${TLS_CERTS_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - ${ACME_WEBROOT:-/var/www/certbot}:/var/www/acme:ro
      - nginx_cache:/var/cache/nginx/ucicle
      - cache_signal:/var/run/ucicle-signal
    depends_on:
      web:
        condition: service_started
    networks: [edge]
    logging: *logging

networks:
  edge:
  data:

volumes:
  db_data:
  jobs_data:
  nginx_cache:
  cache_signal:
