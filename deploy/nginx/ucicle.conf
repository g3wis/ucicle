# Reverse proxy of www.ucicle.fr (stock nginx image, mounted as /etc/nginx/conf.d/default.conf,
# inside the image's `http` block). TLS certificates: Let's Encrypt files of the host, mounted
# read-only on /etc/letsencrypt (deploy/README.md). Compression: gzip only (the stock image has no
# brotli module).

server_tokens off;

log_format ucicle '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" rt=$request_time '
                  'ut=$upstream_response_time cache=$upstream_cache_status';
access_log /var/log/nginx/access.log ucicle;

# Docker's embedded DNS: `web` is resolved again when its container is recreated (new address).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream ucicle_web {
    zone ucicle_web 64k;
    server web:4321 resolve;
    keepalive 16;
}

# Short shared cache in front of the Astro server. It follows the app's own headers
# (front/src/server/http.ts): s-maxage, stale-while-revalidate, no-store, ETag; nothing is cached
# without a Cache-Control from the app (no proxy_cache_valid). The nightly job asks for a purge
# after `yarn rate` (deploy/nginx/50-ucicle-cache-purge.sh).
proxy_cache_path /var/cache/nginx/ucicle levels=1:2 keys_zone=ucicle:20m max_size=2g
                 inactive=2d use_temp_path=off;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types text/css text/plain text/xml application/javascript application/json
           application/xml application/manifest+json image/svg+xml;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# HTTP: Let's Encrypt challenges (certbot --webroot on the host), everything else to https://www.
server {
    listen 80 default_server;
    server_name ucicle.fr www.ucicle.fr _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://www.ucicle.fr$request_uri;
    }
}

# HTTPS apex: 301 to www.
server {
    listen 443 ssl;
    http2 on;
    server_name ucicle.fr;

    ssl_certificate     /etc/letsencrypt/live/www.ucicle.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.ucicle.fr/privkey.pem;

    return 301 https://www.ucicle.fr$request_uri;
}

# HTTPS www: the site.
server {
    listen 443 ssl default_server;
    http2 on;
    server_name www.ucicle.fr;

    ssl_certificate     /etc/letsencrypt/live/www.ucicle.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.ucicle.fr/privkey.pem;

    # Only here (no add_header in the locations, which would drop these).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Cache-Status $upstream_cache_status always;

    client_max_body_size 64k;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    # Bodies are cached uncompressed; nginx compresses for each client.
    proxy_set_header Accept-Encoding "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    proxy_cache ucicle;
    proxy_cache_key $scheme$host$request_uri;
    # An expired page is revalidated with its ETag (If-None-Match): a 304 from the app refreshes it.
    proxy_cache_revalidate on;
    # One request fills a missing page; the others wait for it (at most 5 s, then go to the app).
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    proxy_cache_lock_age 10s;
    # A stale copy is served while it is refreshed, or when the app fails.
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;

    # Search field and the game's link to a rider page: answers depend on the query string and are
    # no-store; never looked up in nor written to the cache.
    location = /api/recherche {
        proxy_cache off;
        proxy_pass http://ucicle_web;
    }
    location = /api/fiche {
        proxy_cache off;
        proxy_pass http://ucicle_web;
    }

    location / {
        proxy_pass http://ucicle_web;
    }
}
