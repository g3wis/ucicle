# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: CD

on:
  push:
    branches: [ "master" ]

jobs:
  # The website (front/, Astro SSR) and the Index data jobs (functions/) run on one Linux server with
  # Docker Compose (deploy/README.md): build both images, push them to ghcr.io, then pull them on the
  # server over SSH. The SSH step is skipped until its secrets are set.
  deploy_server:
    runs-on: ubuntu-latest
    # One deployment at a time; a newer push waits for the running one.
    concurrency:
      group: deploy-server
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      # Secrets cannot be read in `if:`; their presence is passed through the environment.
      DEPLOY_CONFIGURED: ${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_USER != '' && secrets.DEPLOY_SSH_KEY != '' && secrets.DEPLOY_KNOWN_HOSTS != '' }}
    steps:
    - uses: actions/checkout@v3
    - name: Image names and Node versions
      id: meta
      run: |
        owner="${GITHUB_REPOSITORY_OWNER,,}"
        echo "web=ghcr.io/${owner}/ucicle-web" >> "$GITHUB_OUTPUT"
        echo "jobs=ghcr.io/${owner}/ucicle-jobs" >> "$GITHUB_OUTPUT"
        echo "front_node=$(tr -d '[:space:]v' < front/.nvmrc)" >> "$GITHUB_OUTPUT"
        echo "functions_node=$(tr -d '[:space:]v' < functions/.nvmrc)" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@v3
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push the web image
      uses: docker/build-push-action@v6
      with:
        context: ./front
        file: ./deploy/web.Dockerfile
        build-args: NODE_VERSION=${{ steps.meta.outputs.front_node }}
        push: true
        tags: |
          ${{ steps.meta.outputs.web }}:latest
          ${{ steps.meta.outputs.web }}:sha-${{ github.sha }}
        cache-from: type=gha,scope=web
        cache-to: type=gha,scope=web,mode=max
    - name: Build and push the jobs image
      uses: docker/build-push-action@v6
      with:
        context: ./functions
        file: ./deploy/jobs.Dockerfile
        build-contexts: scheduler=./deploy/jobs
        build-args: NODE_VERSION=${{ steps.meta.outputs.functions_node }}
        push: true
        tags: |
          ${{ steps.meta.outputs.jobs }}:latest
          ${{ steps.meta.outputs.jobs }}:sha-${{ github.sha }}
        cache-from: type=gha,scope=jobs
        cache-to: type=gha,scope=jobs,mode=max
    - name: Server deployment skipped
      if: env.DEPLOY_CONFIGURED != 'true'
      run: echo "::notice title=Server not deployed::Images pushed. Set the secrets DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS to deploy (deploy/README.md)."
    - name: Deploy on the server
      if: env.DEPLOY_CONFIGURED == 'true'
      env:
        DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/srv/ucicle' }}
        # Short-lived (this job only): lets the server pull the images, then it logs out.
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        install -m 700 -d ~/.ssh
        printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
        # The script is expanded here and sent on stdin: the token never appears in a command line.
        ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes \
          "$DEPLOY_USER@$DEPLOY_HOST" sh -s <<EOF
        set -eu
        trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
        cd '$DEPLOY_DIR'
        git pull --ff-only --quiet
        cd deploy
        printf '%s' '$GHCR_TOKEN' | docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin
        docker compose pull web jobs
        docker compose up -d --remove-orphans
        # A changed deploy/nginx/ucicle.conf is a bind mount: compose does not restart nginx for it.
        if docker compose ps --status running --services | grep -qx nginx; then
          docker compose exec -T nginx nginx -t && docker compose exec -T nginx nginx -s reload
        fi
        docker image prune -f --filter until=720h
        docker compose ps
        EOF

  deploy_functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./functions/
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js from functions/.nvmrc
      uses: actions/setup-node@v3
      with:
        node-version-file: './functions/.nvmrc'
        cache: 'yarn'
        cache-dependency-path: './functions/yarn.lock'
    - name: Run functions cd script
      run: |
        yarn cd
      env:
        ACCESS_KEY: ${{ secrets.ACCESS_KEY }}
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
        DOMAIN: ${{ vars.DOMAIN }}
        REGION: ${{ vars.REGION }}
        BUCKET_NAME: ${{ vars.BUCKET_NAME }}
        FUNCTION_ID: ${{ vars.FUNCTION_ID }}
